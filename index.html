
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta regresiva</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 15% 20%,
        rgba(0, 140, 255, 0.24), transparent 42%),
      radial-gradient(ellipse at 85% 80%,
        rgba(0, 75, 180, 0.22), transparent 45%),
      linear-gradient(135deg, #030712, #071a35 55%,
        #020617);
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
    overflow-x: hidden;
  }

  .contenedor {
    position: relative;
    padding: 45px 20px;
    width: 100%;
    max-width: 1000px;
    margin: 20px;
    background: rgba(7, 20, 42, 0.68);
    border: 1px solid rgba(56, 189, 248, 0.28);
    border-radius: 24px;
    box-shadow:
      0 0 40px rgba(0, 140, 255, 0.13),
      inset 0 0 35px rgba(0, 140, 255, 0.06);
    backdrop-filter: blur(10px);
  }

  h1 {
    color: #38bdf8;
    font-size: clamp(24px, 5vw, 38px);
    letter-spacing: 4px;
    text-shadow: 0 0 18px rgba(56, 189, 248, 0.65);
  }

  h2 {
    font-weight: normal;
    color: #dbeafe;
    letter-spacing: 1px;
  }

  .reloj {
    display: flex;
    justify-content: center;
    gap: 15px;
    flex-wrap: wrap;
    margin-top: 40px;
  }

  .unidad {
    background: linear-gradient(145deg,
      rgba(15, 45, 82, 0.95),
      rgba(5, 18, 40, 0.95));
    border: 1px solid rgba(56, 189, 248, 0.5);
    border-radius: 16px;
    padding: 22px 14px;
    min-width: 120px;
    box-shadow:
      0 0 18px rgba(0, 153, 255, 0.16),
      inset 0 0 15px rgba(56, 189, 248, 0.07);
  }

  .numero {
    font-size: clamp(38px, 8vw, 64px);
    font-weight: bold;
    color: #f0f9ff;
    text-shadow: 0 0 18px rgba(56, 189, 248, 0.5);
    font-variant-numeric: tabular-nums;
  }

  .etiqueta {
    margin-top: 10px;
    font-size: 13px;
    color: #7dd3fc;
    letter-spacing: 2px;
  }

  p {
    color: #94a3b8;
    margin-top: 38px;
    letter-spacing: 1px;
  }

  @media (max-width: 480px) {
    .contenedor {
      padding: 30px 12px;
      margin: 12px;
    }

    .unidad {
      min-width: 72px;
      padding: 16px 9px;
    }

    .reloj {
      gap: 8px;
    }

    .etiqueta {
      font-size: 10px;
      letter-spacing: 1px;
    }
  }
</style>
</head>
<body>
<div class="contenedor">
  <h1>⏳ CUENTA REGRESIVA</h1>
  <h2>Hasta el 1 de mayo de 2027</h2>

  <div class="reloj">
    <div class="unidad">
      <div class="numero" id="dias">0</div>
      <div class="etiqueta">DÍAS</div>
    </div>
    <div class="unidad">
      <div class="numero" id="horas">00</div>
      <div class="etiqueta">HORAS</div>
    </div>
    <div class="unidad">
      <div class="numero" id="minutos">00</div>
      <div class="etiqueta">MINUTOS</div>
    </div>
    <div class="unidad">
      <div class="numero" id="segundos">00</div>
      <div class="etiqueta">SEGUNDOS</div>
    </div>
  </div>
  <p id="mensaje">Cada segundo cuenta...</p>
</div>

<script>
  function actualizar() {
    // Medianoche de Argentina, UTC-3
    const objetivo = Date.UTC(2027, 4, 1, 3, 0, 0);
    const ahora = Date.now();
    let restante = Math.max(0, objetivo - ahora);

    if (restante === 0) {
      document.getElementById("mensaje").textContent =
        "🎉 ¡Llegó el día!";
    }

    const dias = Math.floor(restante / 86400000);
    const horas = Math.floor((restante % 86400000) / 3600000);
    const minutos = Math.floor((restante % 3600000) / 60000);
    const segundos = Math.floor((restante % 60000) / 1000);

    document.getElementById("dias").textContent = dias;
    document.getElementById("horas").textContent =
      String(horas).padStart(2, "0");
    document.getElementById("minutos").textContent =
      String(minutos).padStart(2, "0");
    document.getElementById("segundos").textContent =
      String(segundos).padStart(2, "0");
  }

  actualizar();
  setInterval(actualizar, 1000);
</script>
</body>
</html>
