

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuenta regresiva | 2027</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    radial-gradient(ellipse at 15% 20%,
      rgba(0,140,255,.24), transparent 42%),
    radial-gradient(ellipse at 85% 80%,
      rgba(0,75,180,.22), transparent 45%),
    linear-gradient(135deg,#030712,#071a35 55%,#020617);
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow-x: hidden;
}

/* FONDO DE PARTICULAS */
#particulas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* TABLERO PRINCIPAL */
.contenedor {
  position: relative;
  z-index: 1;
  padding: 45px 20px;
  width: calc(100% - 32px);
  max-width: 1000px;
  margin: 20px;
  background: rgba(7,20,42,.76);
  border: 1px solid rgba(56,189,248,.5);
  border-radius: 24px;
  box-shadow:
    0 0 25px rgba(0,153,255,.2),
    0 0 65px rgba(0,153,255,.12),
    inset 0 0 35px rgba(0,140,255,.08);
  backdrop-filter: blur(10px);
  animation: entrada 1.2s ease-out;
}

@keyframes entrada {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* TITULOS NEON */
h1 {
  color: #38bdf8;
  font-size: clamp(24px,5vw,40px);
  letter-spacing: 4px;
  text-shadow:
    0 0 5px #38bdf8,
    0 0 15px #0ea5e9,
    0 0 35px rgba(14,165,233,.85);
}

h2 {
  font-weight: normal;
  color: #dbeafe;
  letter-spacing: 1px;
  opacity: 0;
  animation: aparecerTexto 3s ease-out 0.8s forwards;
}

@keyframes aparecerTexto {
  0% {
    opacity: 0;
    transform: translateY(12px);
    text-shadow: 0 0 0 transparent;
  }

  60% {
    opacity: 0.6;
    transform: translateY(3px);
    text-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
  }

  100% {
    opacity: 1;
    transform: translateY(0);
    text-shadow: 0 0 14px rgba(56, 189, 248, 0.25);
  }
}

@keyframes aparecerTexto {
  0% {
    opacity: 0;
    transform: translateY(12px);
    text-shadow: 0 0 0 transparent;
  }

/* CONTADOR */
.reloj {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-top: 40px;
}

.unidad {
  background: linear-gradient(145deg,
    rgba(15,45,82,.96),
    rgba(5,18,40,.97));
  border: 1px solid rgba(56,189,248,.7);
  border-radius: 16px;
  padding: 22px 14px;
  min-width: 120px;
  box-shadow:
    0 0 12px rgba(0,153,255,.22),
    0 0 28px rgba(0,153,255,.12),
    inset 0 0 18px rgba(56,189,248,.09);
  transition: box-shadow .3s ease,
              border-color .3s ease;
}

.unidad:hover {
  border-color: #7dd3fc;
  box-shadow:
    0 0 20px rgba(56,189,248,.4),
    0 0 40px rgba(0,153,255,.2);
}

/* NUMEROS */
.numero {
  font-size: clamp(38px,8vw,64px);
  font-weight: bold;
  color: #f0f9ff;
  text-shadow:
    0 0 6px #fff,
    0 0 16px #38bdf8,
    0 0 32px rgba(56,189,248,.8);
  font-variant-numeric: tabular-nums;
}

/* PULSO DIGITAL DE LOS SEGUNDOS */
.pulso {
  animation: pulsoDigital .35s ease-out;
}

@keyframes pulsoDigital {
  0% {
    transform: scale(1);
    opacity: .65;
    text-shadow: 0 0 4px #38bdf8;
  }
  45% {
    transform: scale(1.12);
    opacity: 1;
    text-shadow:
      0 0 12px #fff,
      0 0 30px #38bdf8,
      0 0 48px #0ea5e9;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

.etiqueta {
  margin-top: 10px;
  font-size: 13px;
  color: #7dd3fc;
  letter-spacing: 2px;
  text-shadow: 0 0 10px rgba(56,189,248,.5);
}

p {
  color: #94a3b8;
  margin-top: 38px;
  letter-spacing: 1px;
}

/* PIE */
.pie {
  margin-top: 24px;
  color: #64748b;
  font-size: 11px;
  letter-spacing: 2px;
}

/* CELULARES */
@media (max-width: 480px) {
  .contenedor {
    padding: 30px 12px;
    margin: 12px;
  }

  .unidad {
    min-width: 72px;
    padding: 16px 9px;
  }

  .reloj {
    gap: 8px;
  }

  .etiqueta {
    font-size: 10px;
    letter-spacing: 1px;
  }

  h1 {
    letter-spacing: 2px;
  }
}

/* ACCESIBILIDAD */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>

<canvas id="particulas"></canvas>

<div class="contenedor">
  <h1>⏳ CUENTA REGRESIVA</h1>
  <h2>Hasta el 1 de mayo de 2027</h2>

  <div class="reloj">
    <div class="unidad">
      <div class="numero" id="dias">000</div>
      <div class="etiqueta">DÍAS</div>
    </div>

    <div class="unidad">
      <div class="numero" id="horas">00</div>
      <div class="etiqueta">HORAS</div>
    </div>

    <div class="unidad">
      <div class="numero" id="minutos">00</div>
      <div class="etiqueta">MINUTOS</div>
    </div>

    <div class="unidad">
      <div class="numero" id="segundos">00</div>
      <div class="etiqueta">SEGUNDOS</div>
    </div>
  </div>

  <p id="mensaje">Cada segundo cuenta...</p>
  <div class="pie">SISTEMA DE CUENTA REGRESIVA // 2027</div>
</div>

<script>
// CONTADOR REGRESIVO
const objetivo = Date.UTC(2027, 4, 1, 3, 0, 0);

function actualizar() {
  const ahora = Date.now();
  const restante = Math.max(0, objetivo - ahora);

  const dias = Math.floor(restante / 86400000);
  const horas = Math.floor((restante % 86400000) / 3600000);
  const minutos = Math.floor((restante % 3600000) / 60000);
  const segundos = Math.floor((restante % 60000) / 1000);

  document.getElementById("dias").textContent = dias;
  document.getElementById("horas").textContent =
    String(horas).padStart(2, "0");
  document.getElementById("minutos").textContent =
    String(minutos).padStart(2, "0");

  const elementoSegundos = document.getElementById("segundos");
  const nuevoSegundo = String(segundos).padStart(2, "0");

  if (elementoSegundos.textContent !== nuevoSegundo) {
    elementoSegundos.textContent = nuevoSegundo;

    elementoSegundos.classList.remove("pulso");
    void elementoSegundos.offsetWidth;
    elementoSegundos.classList.add("pulso");
  }

  if (restante <= 0) {
    document.getElementById("mensaje").textContent =
      "🎉 ¡LLEGÓ EL DÍA!";
    clearInterval(intervalo);
  }
}

actualizar();
const intervalo = setInterval(actualizar, 250);


// FONDO ANIMADO DE PARTICULAS
const canvas = document.getElementById("particulas");
const ctx = canvas.getContext("2d");

let ancho, alto, particulas = [];
let cantidad = 65;

function ajustarCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  ancho = window.innerWidth;
  alto = window.innerHeight;

  canvas.width = ancho * dpr;
  canvas.height = alto * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  cantidad = ancho < 600 ? 28 : 65;

  particulas = Array.from({length: cantidad}, () => ({
    x: Math.random() * ancho,
    y: Math.random() * alto,
    radio: Math.random() * 1.8 + .5,
    velocidad: Math.random() * .35 + .12,
    fase: Math.random() * Math.PI * 2
  }));
}

function dibujarParticulas() {
  ctx.clearRect(0, 0, ancho, alto);

  const tiempo = Date.now() * .001;

  for (let i = 0; i < particulas.length; i++) {
    const p = particulas[i];

    p.y -= p.velocidad;
    p.x += Math.sin(tiempo + p.fase) * .18;

    if (p.y < -5) {
      p.y = alto + 5;
      p.x = Math.random() * ancho;
    }

    if (p.x < 0) p.x = ancho;
    if (p.x > ancho) p.x = 0;

    const brillo = .35 + .45 *
      (Math.sin(tiempo * 1.5 + p.fase) + 1) / 2;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radio, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(56,189,248,${brillo})`;
    ctx.shadowBlur = 9;
    ctx.shadowColor = "#0ea5e9";
    ctx.fill();
    ctx.shadowBlur = 0;

    // Conexiones sutiles entre partículas cercanas
    for (let j = i + 1; j < particulas.length; j++) {
      const q = particulas[j];
      const dx = p.x - q.x;
      const dy = p.y - q.y;
      const distancia = Math.sqrt(dx*dx + dy*dy);

      if (distancia < 105) {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(q.x, q.y);
        ctx.strokeStyle =
          `rgba(56,189,248,${.10 * (1-distancia/105)})`;
        ctx.lineWidth = .6;
        ctx.stroke();
      }
    }
  }

  requestAnimationFrame(dibujarParticulas);
}

ajustarCanvas();
dibujarParticulas();
window.addEventListener("resize", ajustarCanvas);
</script>

</body>
</html>
